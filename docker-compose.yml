services:
  bot:
    build: .
    command: python -m tracker.bot
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  dashboard:
    build: .
    command: uvicorn tracker.dashboard:app --host 0.0.0.0 --port 8000
    env_file: .env
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped
