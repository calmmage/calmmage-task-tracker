services:
  bot:
    build: .
    command: python -m tracker.bot
    env_file: .env
    environment:
      OBSIDIAN_VAULT_MOUNT: /vault
    volumes:
      - ./data:/app/data
      - ./plan:/app/plan:ro
      - ${OBSIDIAN_VAULT:-./data}:/vault:ro
    restart: unless-stopped

  dashboard:
    build: .
    command: uvicorn tracker.dashboard:app --host 0.0.0.0 --port 8000
    env_file: .env
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped
